name: Generate Students JSON With Voices

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-voices-json.yml'

jobs:
  generate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Synthesize Names & Build JSON
        run: |
          python3 - << 'PY'
          import asyncio, base64, json, edge_tts

          # ضع True للنطق بصوت طفلة إنجليزية (en-US-AnaNeural) أو False لصوت طفل عربي مشجّع
          USE_ENGLISH = False

          if USE_ENGLISH:
              VOICE = "en-US-AnaNeural"
              PITCH = "+10Hz"
              RATE = "-5%"
          else:
              VOICE = "ar-SY-AmanyNeural"
              PITCH = "+28Hz"   # نبرة طفولية مرحة ومشجّعة
              RATE = "-6%"      # بطء خفيف لوضوح نطق الاسم

          # (id, الاسم الظاهر على العجلة, الاسم بالتشكيل للنطق الواضح, إيموجي, لون, النطق الإنجليزي)
          students_data = [
              ("st_01", "عبيدة", "عُبَيْدَة!", "⭐", "#FF6B6B", "Obaida!"),
              ("st_02", "محمد حوى", "مُحَمَّد حَوَّى!", "🦁", "#FF9F1C", "Mohammad Hawwa!"),
              ("st_03", "عبادة", "عُبَادَة!", "🚀", "#2EC4B6", "Obada!"),
              ("st_04", "حمزة", "حَمْزَة!", "⚽", "#3A86FF", "Hamza!"),
              ("st_05", "عثمان", "عُثْمَان!", "🐼", "#8338EC", "Othman!"),
              ("st_06", "تيم", "تَيْم!", "🦊", "#FF006E", "Taym!"),
              ("st_07", "أنس", "أَنَس!", "🌟", "#06D6A0", "Anas!"),
              ("st_08", "أنس حلبية", "أَنَس حَلَبِيَّة!", "🎨", "#118AB2", "Anas Halabiya!"),
              ("st_09", "أحمد الخطيب", "أَحْمَد الخَطِيب!", "🌈", "#F77F00", "Ahmad Al-Khatib!"),
              ("st_10", "عبد الله مصري", "عَبْدُ الله مَصْرِي!", "🐬", "#9B5DE5", "Abdullah Masri!"),
              ("st_11", "عبد الله عكرة", "عَبْدُ الله عَكْرَة!", "🐝", "#00BBF9", "Abdullah Akra!"),
          ]

          async def build():
              students = []
              audio_bundle = {}
              for sid, ar_name, ar_spoken, emoji, color, en_name in students_data:
                  text = en_name if USE_ENGLISH else ar_spoken
                  mp3_path = f"{sid}.mp3"
                  await edge_tts.Communicate(text, VOICE, rate=RATE, pitch=PITCH).save(mp3_path)
                  b64 = base64.b64encode(open(mp3_path, "rb").read()).decode("ascii")
                  audio_bundle[f"voice_{sid}"] = f"data:audio/mpeg;base64,{b64}"
                  students.append({
                      "id": sid,
                      "name": ar_name,
                      "emoji": emoji,
                      "color": color,
                      "active": True,
                      "phonetic": en_name.rstrip("!"),
                      "hasCustomVoice": True
                  })

              payload = {
                  "version": 1,
                  "state": {
                      "lang": "ar",
                      "activeClassId": "cls_students_01",
                      "classes": [{
                          "id": "cls_students_01",
                          "name": "صف التلاميذ",
                          "usedIds": [],
                          "students": students
                      }],
                      "settings": {
                          "noRepeat": True, "spinDuration": 4, "muted": False, "quietMode": False,
                          "volSpin": 0.7, "volWin": 0.8, "volSpeech": 1, "volCeiling": 0.9,
                          "spinSound": "wood", "winSound": "tada", "encourageSound": "chime",
                          "hasCustomSpin": False, "hasCustomWin": False, "hasCustomEnc": False,
                          "tplAr": "{name}", "tplEn": "{name}",
                          "speechRate": 0.95, "speechPitch": 1.15,
                          "taskEnabled": False, "taskTimerSec": 30,
                          "tasks": ["اقرأ جملة بصوت واضح 📖", "أجب عن سؤال المعلم 💡", "غنِّ مقطعاً قصيراً 🎵", "أعطنا مثالاً من عندك 🌟"]
                      }
                  },
                  "audioBundle": audio_bundle
              }
              with open("students-class-with-audio.json", "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)

          asyncio.run(build())
          PY

      - name: Upload JSON With Voices
        uses: actions/upload-artifact@v4
        with:
          name: students-class-with-audio
          path: students-class-with-audio.json
